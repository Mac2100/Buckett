name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tagged v<app version>) from this run"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows app + ZIP
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show toolchain
        run: dotnet --info

      - name: Test
        run: dotnet test windows/tests/Buckett.Tests/Buckett.Tests.csproj --configuration Release

      - name: Build app and ZIP
        shell: pwsh
        run: ./windows/build/make_app.ps1

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path windows/src/Buckett/Support/AppVersion.cs `
            -Pattern 'Marketing\s*=\s*"([^"]+)"'
          "version=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buckett-windows
          path: windows/dist/*.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/*.zip
          generate_release_notes: true
          # On tag pushes, release under that tag; on manual dispatch, create
          # the tag v<app version> at the built commit.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
